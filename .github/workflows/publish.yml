name: Publish

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install current npm for trusted publishing
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/*.test.cjs
      - name: Stage release with provenance for maintainer approval
        run: npm stage publish --access public --provenance --ignore-scripts --loglevel=verbose
